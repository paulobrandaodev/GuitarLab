# NVIDIA overlay for the audio lab.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Kept separate because a device reservation is a requirement, not a preference:
# with this block in the base file, `docker compose up` fails outright on any
# machine without nvidia-container-toolkit — "could not select device driver" —
# even though the Python happily runs on CPU and even retries there when CUDA
# runs out of memory. Splitting it means the default works everywhere and the
# GPU is opt-in.
#
# Needs the NVIDIA Container Toolkit installed on the host.
services:
  forge-lab:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
