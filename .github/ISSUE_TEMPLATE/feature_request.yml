name: Feature request
description: Suggest something GuitarLab should do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas from players are as welcome as ideas from developers. If it makes
        practising better, it is worth raising.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: |
        Describe the practice situation, not just the feature. "I need to loop
        two bars and slow them down without dropping a semitone" tells us more
        than "add a speed slider".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?

  - type: textarea
    id: alternatives
    attributes:
      label: How do you work around it today?
      description: Another app, a manual step, or just living with it.
