name: Release

on:
  push:
    tags: ['v*']
  # so a failed release can be retried without moving the tag
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The subset that needs nothing external. A release is the worst place to
      # find out the bundle does not build, and `npm run build` below would not
      # catch a broken catalogue or a settings regression.
      # Ubuntu runners restrict unprivileged user namespaces, so Electron's SUID
      # sandbox helper refuses to start and every suite that opens a real window
      # aborts with SIGTRAP before running a single assertion. Giving the helper
      # the ownership it expects keeps the sandbox on, where --no-sandbox would
      # switch it off and quietly test a configuration nobody ships.
      - name: Let Electron's sandbox start (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:ci

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: npm run test:ci

      # electron-builder produces installers for the platform it runs on;
      # better-sqlite3 has to be compiled there too. There is no cross-compiling
      # out of this, which is why the matrix exists.
      #
      # `npm run build` is not optional here. `build.files` is `out/**`, which
      # is gitignored — on a clean checkout electron-builder on its own would
      # happily package an app with no bundle in it.
      - name: Build and publish
        run: npm run build && npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
