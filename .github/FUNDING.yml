# Puts the "Sponsor" button at the top of the repository.
#
# Two channels on purpose, because they reach different people:
#
# - GitHub Sponsors takes 0% on a personal account and pays out in BRL through
#   Stripe. It is the better deal, and it is the one developers already have set
#   up.
# - Ko-fi takes 0% on one-off donations, accepts cards and PayPal from any
#   country, and — the part that matters here — does not require the donor to
#   have a GitHub account at all. Most people this app is for are guitarists,
#   not developers.
github: paulobrandaodev
ko_fi: paulobrandaodev
