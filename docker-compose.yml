# Optional audio lab. The app works fully without it — only stem separation and
# automatic BPM/key/chord analysis need this container.
#
#   docker compose up -d                                    CPU, works anywhere
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d    NVIDIA
#
# Heads up: the CUDA base image is large (the final image lands around 12-15 GB)
# and the model weights are downloaded on first use. Skip all of this unless you
# actually want stem separation.
#
# Folder overrides go in a `.env` file next to this one — see .env.example. They
# default to the folders in the repository, which is what you want when running
# from source.
services:
  forge-lab:
    build: ./lab
    container_name: guitarlab-lab
    ports:
      # loopback only: this is a local sidecar, never something to expose
      - "127.0.0.1:8756:8756"
    volumes:
      # The sidecar's own source, live. The image bakes a copy at build time, but
      # editing lab/app/ and running `npm run lab:up` used to leave the old code
      # running inside the container — the analysis silently stayed one version
      # behind. Mounted read-only over that copy, with uvicorn watching it.
      - "./lab/app:/app/app:ro"
      # read-only mounts of the media the app points at
      - "${SONGS_DIR:-./songs}:/data/songs:ro"
      - "${GPTABS_DIR:-./gptabs}:/data/gptabs:ro"
      # stems are written back here so Electron can read them
      - "${STEMS_DIR:-./.stems}:/data/stems"
      # cache model weights across restarts, otherwise every run re-downloads
      - "guitarlab-models:/models"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8756",
       "--reload", "--reload-dir", "/app/app"]
    environment:
      STEMS_DIR: /data/stems
      # Maps host paths to their mount points inside the container, so the app
      # can keep sending real paths and the container resolves them. These have
      # to match the volumes above; the defaults assume you are running from a
      # clone of the repository.
      PATH_MAP: "${SONGS_DIR:-./songs}=>/data/songs;${GPTABS_DIR:-./gptabs}=>/data/gptabs;${STEMS_DIR:-./.stems}=>/data/stems"
    restart: unless-stopped

volumes:
  guitarlab-models:
